[project]
name = "phyai-monorepo"
version = "0.1.0"
description = "phyai — Physical AI. Workspace coordinator."
requires-python = ">=3.12"
dependencies = [
    "phyai",
    "phyai-kernel",
    "phyai-ext",
    "phyai-model-optimizer",
    "phyai-utils-tools",
]

[tool.ruff.format]
preview = false

[tool.ruff.lint.isort]
length-sort = true

[tool.uv]
package = false

[tool.uv.workspace]
members = ["phyai", "phyai-kernel", "phyai-ext", "phyai-model-optimizer", "phyai-utils-tools", "phyai-robot"]

[tool.uv.sources]
phyai = { workspace = true }
phyai-kernel = { workspace = true }
phyai-ext = { workspace = true }
phyai-model-optimizer = { workspace = true }
phyai-utils-tools = { workspace = true }
phyai-robot = { workspace = true }

[dependency-groups]
deployment = [
    "omegaconf>=2.3,<2.4",
    "phyai-robot",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[tool.pytest.ini_options]
addopts = ["-ra", "--import-mode=importlib"]
markers = [
    "gpu: requires a working CUDA runtime",
    "ipc: exercises inter-process buffer transport",
    "multi_gpu: requires at least two visible CUDA devices and NCCL",
]
testpaths = [
    "phyai/tests",
    "phyai-kernel/tests",
    "phyai-ext/tests",
    "phyai-model-optimizer/tests",
    "phyai-utils-tools/tests",
    "phyai-robot/tests",
]
pythonpath = [
    "phyai/src",
    "phyai-kernel",
    "phyai-ext/src",
    "phyai-model-optimizer/src",
    "phyai-utils-tools/src",
    "phyai-robot/src",
]
