# PI0.5: MXFP4 weights, group size 32; BF16 activations only.
# Text and action-expert attention/MLP projections.
# Vision, embeddings, action/time heads, norms and the value head keep their precision.
# Load an unquantized checkpoint; selected Linear layers accept and return BF16.
# With the examples' BF16 compute, this preset requires NVIDIA SM80+.
# Select with PHYAI_KERNEL_CONFIG before running run_pi05.py.
# humming-kernels 0.1.16 requires BF16 compute for MXFP4.

schema: phyai.kernel/v1
profile: static

quantization:
  method: rtn
  stage: load
  default: null
  rules:
    - match:
        regex: '^paligemma_with_expert\.(paligemma\.model\.language_model|gemma_expert\.model)\.layers\.[0-9]+\.(self_attn\.(qkv_proj|o_proj)|mlp\.(gate_up_proj|down_proj))$'
      weight:
        dtype: mxfp4
        granularity: block
        block_shape: [1, 32]
        symmetric: true
        micro_scaled: true
      input: null

rules:
  - id: humming-quantized-linear
    match:
      op: gemm
      quant.layout: humming
    restrict_to: humming.gemm.mxfp4_a16

  # Preserve the existing PI0.5 attention policy on SM90.
  - id: pi05-expert-joint-fa2
    priority: 10
    match:
      op: attention_paged
      role: expert
      model.family: pi05
      device.arch: sm90
    restrict_to: flashinfer.attention_paged.fa2
