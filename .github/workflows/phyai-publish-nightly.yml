# Publish the current nightly and all GitHub Release packages at /simple/.
# Release files stay in GitHub Releases; Pages contains their download links.
# Set repository Settings -> Pages -> Source to "GitHub Actions" before use.
name: phyai nightly publish

on:
  schedule:
    # 18:47 UTC daily. Off the :00 mark on purpose.
    - cron: "47 18 * * *"
  # Manual "Run workflow" button (use this for the first publish).
  workflow_dispatch:

# Serialize publishes: a Pages deployment must never race another. Do NOT cancel
# an in-progress publish — a half-finished deploy is worse than a queued one.
concurrency:
  group: phyai-pages
  cancel-in-progress: false

permissions:
  contents: read
  # The skip-when-unchanged gate reads this workflow's own run history.
  actions: read

jobs:
  # One source of truth for the version, so build-ext and build-index can't
  # disagree if the run straddles UTC midnight.
  setup:
    name: compute nightly version
    if: github.repository == 'mingti-org/phyai'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      # fetch-depth: 0 brings the full history + tags so the base version can be
      # derived from the latest git tag.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A scheduled run skips when HEAD is exactly what the last successful
      # run already built — republishing identical content under a new dev
      # date wastes CI minutes and index entries. SHA equality (rather than a
      # "commits in the last 24h" window) cannot silently drop a commit when
      # the cron fires late, and it fails open: any API hiccup publishes.
      # A manual workflow_dispatch always publishes.
      - name: Skip when HEAD is already published
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLISH=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            LAST=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/phyai-publish-nightly.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty' || true)
            if [ -n "$LAST" ] && [ "$LAST" = "${{ github.sha }}" ]; then
              echo "HEAD ${LAST} was already built by the last successful run; skipping."
              PUBLISH=false
            fi
          fi
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"

      # Base version = latest git tag; UTC date makes each nightly unique; patch
      # is bumped by one so the dev build sorts ABOVE the last release per PEP 440
      # (X.Y.Z < X.Y.(Z+1).devN). No "+local" segment — PyPI-safe and valid in a
      # simple index. setuptools-scm honors SETUPTOOLS_SCM_PRETEND_VERSION, so this
      # one value stamps every package.
      - name: Compute nightly version
        id: ver
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo 0.0.0)
          BASE=$(echo "${TAG:-0.0.0}" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')
          VERSION="${BASE}.dev$(date -u +%Y%m%d)"
          echo "Publishing version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: build nightly packages
    needs: setup
    if: needs.setup.outputs.publish == 'true'
    uses: ./.github/workflows/phyai-build-packages.yml
    with:
      version: ${{ needs.setup.outputs.version }}
      source-ref: ${{ github.sha }}

  build-index:
    name: build wheel index
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Fetch every page of releases and assets before replacing the Pages site.
      - name: Fetch release history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > release-pages.json
          python - <<'PYTHON'
          import json
          import os
          import subprocess
          from pathlib import Path

          releases = [
              release
              for page in json.loads(Path("release-pages.json").read_text())
              for release in page
              if not release["draft"]
          ]
          for release in releases:
              endpoint = (
                  f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/"
                  f"{release['id']}/assets?per_page=100"
              )
              pages = json.loads(
                  subprocess.check_output(
                      ["gh", "api", "--paginate", "--slurp", endpoint], text=True
                  )
              )
              release["assets"] = [asset for page in pages for asset in page]
          Path("releases.json").write_text(json.dumps(releases), encoding="utf-8")
          PYTHON

      - name: Build wheel index
        run: >-
          python scripts/build_wheel_index.py
          --dist-dir dist --releases-json releases.json --out-dir site

      - name: Summarize
        if: always()
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          {
            echo "### phyai nightly publish: $VERSION"
            echo ""
            echo '```'
            ls -lh dist 2>/dev/null || echo "no dist/ produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy wheel index to Pages
    needs: build-index
    runs-on: ubuntu-latest
    # deploy-pages requires these elevated scopes + the github-pages environment.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
