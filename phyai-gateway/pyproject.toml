[project]
name = "phyai-gateway"
dynamic = ["version"]
description = "HTTP and gRPC gateway for PhyAI model inference."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "grpcio>=1.73.1",
    "msgpack",
    "numpy",
    "protobuf>=6.31.1",
    "uvicorn",
]

[project.optional-dependencies]
lerobot = ["lerobot", "torch"]
codegen = ["grpcio-tools==1.73.1"]

[project.scripts]
phyai-gateway = "phyai_gateway.server:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "..", fallback_version = "0.1.0" }

[tool.hatch.build.targets.wheel]
packages = ["phyai_gateway"]

[tool.hatch.build.targets.sdist]
include = ["phyai_gateway", "pyproject.toml", "README.md"]
