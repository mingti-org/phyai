[project]
name = "phyai-gateway"
version = "0.1.0"
description = "HTTP and gRPC gateway for PhyAI model inference."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "grpcio",
    "lerobot",
    "msgpack",
    "numpy",
    "protobuf",
    "torch",
    "uvicorn",
]

[project.scripts]
phyai-gateway = "phyai_gateway.gateway:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phyai_gateway"]

[tool.hatch.build.targets.sdist]
include = ["phyai_gateway", ".gitignore"]
