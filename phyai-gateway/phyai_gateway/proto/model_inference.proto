syntax = "proto3";

package robot.inference.v1;
// Unified inference service from the Gateway to the Model Server.
// Each unary RPC performs inference for one observation.
service ModelInference {
  rpc Infer(InferenceRequest) returns (InferenceResponse);
}


service ModelRegistry{
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

// Generic data type.
enum DataType {
  DATA_TYPE_UNSPECIFIED = 0;
  DATA_TYPE_UINT8 = 1;
  DATA_TYPE_INT32 = 2;
  DATA_TYPE_INT64 = 3;
  DATA_TYPE_FLOAT16 = 4;
  DATA_TYPE_BFLOAT16 = 5;
  DATA_TYPE_FLOAT32 = 6;
  DATA_TYPE_FLOAT64 = 7;
  DATA_TYPE_BOOL = 8;
}
// Image data encoding.
enum ImageEncoding {
  IMAGE_ENCODING_UNSPECIFIED = 0;
  // Uncompressed pixel data; shape, dtype, and layout must be valid.
  IMAGE_ENCODING_RAW = 1;
  // The data contains the complete compressed JPEG/PNG file.
  IMAGE_ENCODING_JPEG = 2;
  IMAGE_ENCODING_PNG = 3;
}
// Dimension layout for uncompressed images.
enum ImageLayout {
  IMAGE_LAYOUT_UNSPECIFIED = 0;
  IMAGE_LAYOUT_HWC = 1;
  IMAGE_LAYOUT_CHW = 2;
}
// Generic contiguous tensor.
//
// Data is stored contiguously in C order (row-major).
// Multi-byte values use little-endian encoding.
// The data length must match the shape and dtype.
message Tensor {
  bytes data = 1;
  repeated uint64 shape = 2;
  DataType dtype = 3;
}
// Image from one camera.
message Image {
  // Camera or image name, for example "front" or "wrist".
  string name = 1;
  // RAW pixels or the complete JPEG/PNG file.
  bytes data = 2;
  // RAW images must provide the complete shape, for example [480, 640, 3].
  // Compressed images may provide the expected decoded shape or leave it empty.
  repeated uint64 shape = 3;
  // Required for RAW images; compressed images are usually UINT8.
  DataType dtype = 4;
  ImageEncoding encoding = 5;
  // Required for RAW images; compressed images may be determined after decoding by the Model Server.
  ImageLayout layout = 6;
}
// One model inference request.
message InferenceRequest {
  // Unique identifier generated by the Gateway.
  // The Model Server must return it unchanged in the response.
  string request_id = 1;
  // Unix timestamp in nanoseconds when the observation was captured on the robot.
  int64 timestamp_ns = 2;
  // The first version sends one image; repeated preserves compatibility with future multi-camera support.
  repeated Image images = 3;
  // Generic one-dimensional tensor containing the robot state.
  // The Client Adapter and model configuration define the meaning and order of each dimension.
  Tensor robot_state = 4;
  // Raw natural-language task instruction.
  // Tokenization is performed by the Model Server.
  string instruction = 5;
  // Requested number of actions in the response.
  // 0 means to use the model default action horizon.
  uint32 requested_action_horizon = 6;
  // Optional JSON object for unstable extension parameters that receivers may ignore.
  string extensions_json = 7;
}
// One model inference response.
message InferenceResponse {
  // Must match the request_id of the corresponding request.
  string request_id = 1;
  // Generic action tensor produced by the model, usually [T, D]:
  // T is the number of actions, and D is the dimension of each action.
  // The first version does not define the business semantics of each dimension.
  Tensor actions = 2;
  // Model inference time inside the Model Server, excluding gRPC transport.
  uint64 inference_time_us = 3;
  // Optional JSON object for unstable extension results that receivers may ignore.
  string extensions_json = 4;
}



message RegisterRequest {
  // Address reachable by the Gateway, for example "10.0.0.8:50061".
  string endpoint = 1;
  // Name of the model provided by this Server, for example "pi05".
  string model_name = 2;
}
message RegisterResponse {
  // Whether the Gateway accepted the registration.
  bool accepted = 1;
  // Unique identifier for the Model Server instance; stable for the process lifetime.
  string server_id = 2;
  // Heartbeat interval requested by the Gateway.
  uint32 heartbeat_interval_seconds = 3;
  // Registration failure reason; empty on success.
  string message = 4;
}
message HeartbeatRequest {
  // Must match the server_id returned by Register.
  string server_id = 1;
}
message HeartbeatResponse {
  // Whether the Gateway still recognizes the Server.
  // If false, the Model Server should register again.
  bool registered = 1;
  string message = 2;
}